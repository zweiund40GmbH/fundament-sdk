[package]
name = "z40-fundament"
description = "Building blocks for apps that share data over a pull-based change feed: feed source and consumer, local replica, status endpoint and client, and static service keys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["change-feed", "replication", "sync", "status", "mariadb"]
categories = ["database", "web-programming"]
include = ["src/**/*.rs", "tests/**/*.rs", "schema/*.sql", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lints]
workspace = true

[features]
default = []
# Static service keys: verify incoming bearer keys against a `name=sha256hex` list, failure brake,
# outgoing bearer key.
credentials = ["dep:sha2", "dep:subtle"]
# Read a change feed page by page; the app provides lock, cursor and page storage via traits.
feed-consumer = ["credentials", "dep:reqwest", "dep:webpki-root-certs", "dep:tracing"]
# Keep a local replica of feed records (version rule, tombstones, projection hook).
replica = ["feed-consumer"]
# Ready-made MariaDB/MySQL (sqlx) implementations of the consumer and replica traits.
replica-mysql = ["replica", "dep:sqlx"]
# Serve `GET /fundament/v1/status` with axum.
status = ["credentials", "dep:axum", "dep:tokio", "dep:tracing"]
# Read `GET /fundament/v1/status` of other apps: client, per-app status keys, bounded parallel polling.
status-client = ["credentials", "dep:reqwest", "dep:webpki-root-certs", "dep:tracing", "dep:tokio", "tokio/rt"]
# Serve a change feed `GET /fundament/v1/events` with axum; the app provides the storage via a trait.
feed-source = ["credentials", "dep:axum", "axum/query", "dep:tokio", "tokio/rt", "dep:tracing"]
# Ready-made MariaDB/MySQL (sqlx) outbox, cursor assigner, retention and poll log for `feed-source`.
feed-source-mysql = ["feed-source", "dep:sqlx"]
# Serve a read-only GraphQL federation subgraph `POST /fundament/v1/graphql` with axum and async-graphql:
# document pre-check, subgraph limits, key check, read budget and process-wide read limiter.
graphql = ["credentials", "dep:async-graphql", "dep:async-graphql-value", "dep:axum", "dep:http-body-util", "dep:tokio", "tokio/sync", "dep:tracing"]
# Helpers for the tests of apps (record keys, feed page builder, status document; with `status-client` also
# `StatusPoller::plain_http_for_tests` and `StatusTarget::plain_http_for_tests`); for dev-dependencies.
test-util = []

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"

# The GraphQL engine of the subgraph; the same major/minor as the apps use (types appear in the API).
async-graphql = { version = "7.2.1", optional = true, default-features = false }
# The unresolved argument values of the parsed document (not re-exported by async-graphql), to count
# `_entities` representations without cloning; part of async-graphql itself.
async-graphql-value = { version = "7.2.1", optional = true }
axum = { version = "0.8.4", optional = true, default-features = false, features = ["json", "tokio"] }
# Reads the subgraph body with a limit and tells an oversized body (413) from a broken one (400); already
# a dependency of axum.
http-body-util = { version = "0.1.3", optional = true }
# rustls (aws-lc-rs, like z40-auth) with the platform verifier: the platform store (which honours
# SSL_CERT_FILE on Linux), so private CAs work. No OpenSSL.
reqwest = { version = "0.13.5", optional = true, default-features = false, features = ["rustls", "query"] }
sha2 = { version = "0.10.9", optional = true }
sqlx = { version = "0.9.0", optional = true, default-features = false, features = ["mysql", "runtime-tokio", "tls-rustls-ring-webpki", "chrono"] }
subtle = { version = "2.6.1", optional = true }
# The built-in Mozilla roots, merged into the platform verifier of reqwest (it has no feature for them).
webpki-root-certs = { version = "1.0.4", optional = true }
tokio = { version = "1.45.0", optional = true, default-features = false, features = ["time"] }
tracing = { version = "0.1.41", optional = true }

[dev-dependencies]
axum = { version = "0.8.4", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1.45.0", features = ["macros", "rt-multi-thread", "net", "time"] }
tower = { version = "0.5.2", features = ["util"] }
sqlx = { version = "0.9.0", default-features = false, features = ["mysql", "runtime-tokio", "tls-rustls-ring-webpki", "chrono"] }


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
