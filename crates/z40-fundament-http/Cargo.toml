[package]
name = "z40-fundament-http"
description = "HTTP groundwork for axum apps: request ids, a redacting trace layer, log setup, security headers, no-store, client address behind trusted proxies, a CSRF header guard and server-side OIDC login with sessions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["axum", "middleware", "security-headers", "csrf", "tracing"]
categories = ["web-programming::http-server"]
include = ["src/**/*.rs", "tests/**/*.rs", "schema/*.sql", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lints]
workspace = true

[features]
default = []
# `X-Request-Id`: incoming ids checked (length, charset) or replaced by a new UUID v7, echoed on the response.
request-id = ["dep:uuid"]
# HTTP trace layer: method, route template, request id, status, latency – never query, headers or bodies.
trace = ["dep:tower-http", "tower-http/trace", "axum/matched-path"]
# Global log setup (JSON lines or readable text, `EnvFilter`) from `<PREFIX>_LOG` and `<PREFIX>_LOG_FORMAT`.
telemetry = ["dep:tracing-subscriber", "dep:tracing-log"]
# Login and sessions for backend-for-frontend apps: OIDC login with `z40-auth`, session cookie, session
# store trait and extractor, logout and back-channel logout.
bff = ["z40-fundament/credentials", "dep:z40-auth", "dep:aws-lc-rs", "dep:base64", "dep:chrono", "dep:serde", "dep:tokio", "dep:url"]
# MariaDB/MySQL (sqlx) implementation of the session store of `bff`.
bff-mysql = ["bff", "dep:sqlx"]

[dependencies]
# Always on: security headers, no-store, client address, CSRF guard and the shared configuration helpers.
axum = { version = "0.8.4", default-features = false, features = ["json", "tokio"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tower = { version = "0.5.2", default-features = false }
# Always on: the one-time warning of `ClientIp` without `ConnectInfo`.
tracing = "0.1.41"
# One configuration system for both crates (`Lookup`, `ConfigVar`, `ConfigError`).
z40-fundament = { workspace = true }

tower-http = { version = "0.7.1", optional = true, default-features = false }
# Without its own `tracing-log` feature: `init` installs the `log` bridge itself to tell the outcomes apart.
tracing-log = { version = "0.2.0", optional = true, default-features = false, features = ["std", "log-tracer"] }
tracing-subscriber = { version = "0.3.20", optional = true, default-features = false, features = ["std", "fmt", "ansi", "env-filter", "json"] }
uuid = { version = "1.18.0", optional = true, features = ["v7"] }

# `bff`: the relying-party library of the login (with its axum extractors).
z40-auth = { version = "0.5.0", optional = true, features = ["axum"] }
# `bff`: random session ids, SHA-256 and AES-256-GCM. Already the crypto backend of `z40-auth`, so no
# second crypto library is built.
aws-lc-rs = { version = "1.18.2", optional = true }
base64 = { version = "0.22.1", optional = true }
chrono = { version = "0.4.42", optional = true, default-features = false, features = ["clock", "std"] }
serde = { version = "1.0.219", optional = true, features = ["derive"] }
# `bff`: the lazily discovered login client (`OnceCell`).
tokio = { version = "1.45.0", optional = true, default-features = false, features = ["sync"] }
# `bff`: URL checks of the configuration and the query of the login route. Already used by `z40-auth`.
url = { version = "2.5.4", optional = true }
sqlx = { version = "0.9.0", optional = true, default-features = false, features = ["mysql", "runtime-tokio", "tls-rustls-ring-webpki", "chrono"] }

[dev-dependencies]
# `http1` and `form`: the fake login provider of the `bff` tests runs as a real server.
axum = { version = "0.8.4", default-features = false, features = ["http1", "json", "tokio", "matched-path", "form"] }
tokio = { version = "1.45.0", features = ["macros", "rt", "rt-multi-thread", "net"] }
tower = { version = "0.5.2", features = ["util"] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "std"] }
# Only for the example that wires the client address into the status endpoint.
z40-fundament = { workspace = true, features = ["status"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
