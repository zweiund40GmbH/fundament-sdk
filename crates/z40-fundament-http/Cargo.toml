[package]
name = "z40-fundament-http"
description = "HTTP groundwork for axum apps: request ids, a redacting trace layer, log setup, security headers, no-store, client address behind trusted proxies and a CSRF header guard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["axum", "middleware", "security-headers", "csrf", "tracing"]
categories = ["web-programming::http-server"]
include = ["src/**/*.rs", "tests/**/*.rs", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[lints]
workspace = true

[features]
default = []
# `X-Request-Id`: incoming ids checked (length, charset) or replaced by a new UUID v7, echoed on the response.
request-id = ["dep:uuid"]
# HTTP trace layer: method, route template, request id, status, latency – never query, headers or bodies.
trace = ["dep:tower-http", "tower-http/trace", "dep:tracing", "axum/matched-path"]
# Global log setup (JSON lines or readable text, `EnvFilter`) from `<PREFIX>_LOG` and `<PREFIX>_LOG_FORMAT`.
telemetry = ["dep:tracing-subscriber"]

[dependencies]
# Always on: security headers, no-store, client address, CSRF guard and the shared configuration helpers.
axum = { version = "0.8.4", default-features = false, features = ["json", "tokio"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tower = { version = "0.5.2", default-features = false }
# One configuration system for both crates (`Lookup`, `ConfigVar`, `ConfigError`).
z40-fundament = { version = "0.3.0", path = "../z40-fundament", default-features = false }

tower-http = { version = "0.7.1", optional = true, default-features = false }
tracing = { version = "0.1.41", optional = true }
tracing-subscriber = { version = "0.3.20", optional = true, features = ["env-filter", "json"] }
uuid = { version = "1.18.0", optional = true, features = ["v7"] }

[dev-dependencies]
axum = { version = "0.8.4", default-features = false, features = ["json", "tokio", "matched-path"] }
tokio = { version = "1.45.0", features = ["macros", "rt"] }
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "std"] }
# Only for the example that wires the client address into the status endpoint.
z40-fundament = { version = "0.3.0", path = "../z40-fundament", features = ["status"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
