# Release of z40-fundament on a tag `vX.Y.Z`: the CI gate, then publishing to crates.io, then the
# GitHub release with the changelog section of the version.
#
# Secrets: CARGO_REGISTRY_TOKEN (crates.io token with publish rights for z40-fundament).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to crates.io
    needs: check
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches the crate version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version} in Cargo.toml"
            exit 1
          fi
      - run: rustup toolchain install
      - run: cargo publish -p z40-fundament --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # npm packages come later; publishing them would be a step here, e.g.:
      # - uses: actions/setup-node@v5
      #   with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      # - run: corepack enable && yarn install --immutable && yarn npm publish --access public
      #   env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[.*\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::no section for ${version} in CHANGELOG.md"
            exit 1
          fi
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
