# Release of z40-fundament on a tag `vX.Y.Z`: the CI gate, then publishing to crates.io, then the
# GitHub release with the changelog section of the version. The tag must point to a commit on `main`
# and match the crate version.
#
# Publishing: crates.io Trusted Publishing (OIDC, no stored token) is the default – register this
# repository and workflow `release.yml` (environment `release`) as trusted publisher of z40-fundament on
# crates.io. Fallback: if the secret CARGO_REGISTRY_TOKEN is set, it is used instead.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to crates.io
    needs: check
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tag commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} points to a commit that is not on main"
            exit 1
          fi
      - name: Tag matches the crate version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version} in Cargo.toml"
            exit 1
          fi
      - run: rustup toolchain install
      # Trusted Publishing: a short-lived token via OIDC (skipped when the fallback secret is set).
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: env.HAS_TOKEN != 'true'
      - run: cargo publish -p z40-fundament --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
      # npm packages come later; publishing them would be a step here, e.g.:
      # - uses: actions/setup-node@v5
      #   with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      # - run: corepack enable && yarn install --immutable && yarn npm publish --access public
      #   env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[.*\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::no section for ${version} in CHANGELOG.md"
            exit 1
          fi
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
