[workspace]
resolver = "3"
members = ["crates/z40-fundament", "crates/z40-fundament-http"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
authors = ["zweiund40 GmbH"]
repository = "https://github.com/zweiund40GmbH/fundament-sdk"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
