# cargo-deny configuration: `just deny` (needs `cargo install --locked cargo-deny`).

[graph]
all-features = true

[advisories]
# RustSec advisory database: vulnerabilities are always errors; unmaintained crates only when they are
# direct dependencies.
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # chrono is unmaintained (no vulnerability). sqlx 0.9 needs it for its date/time types and the public API
    # exposes chrono types; replacing it with `time` or `jiff` is a breaking change tracked as an issue.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no vulnerability; required by sqlx, replacement tracked." },
]

[licenses]
# Permissive licenses compatible with MIT OR Apache-2.0 distribution.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
